[pytest]
# 測試路徑設定
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 輸出設定
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --html=reports/test_report.html
    --self-contained-html
    --color=yes

# 覆蓋率設定
[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

# Markers 標記
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests (Hypothesis)
    performance: Performance tests
    slow: Slow running tests
    fast: Fast tests suitable for pre-commit
    api: Tests that require API access
    cache: Tests that interact with cache

# Timeout 設定
timeout = 300
timeout_method = thread

# 警告處理
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
